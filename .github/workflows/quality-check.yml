name: Quality Check

# SECURITY: This workflow runs untrusted PR code, so it MUST use `pull_request`
# (not `pull_request_target`). With `pull_request`:
#   - The workflow runs in the PR's ref scope, not the base branch's.
#   - Caches written here cannot be restored by workflows on `main`.
#   - For PRs from forks, `secrets.GITHUB_TOKEN` is read-only and no other
#     secrets are exposed. There is no privilege escalation path.
# Do NOT switch back to `pull_request_target` — combined with a PR-head
# checkout it lets untrusted PR code run in the base-branch context and is a
# well-known supply-chain entry point.
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Default to zero permissions; jobs opt in to what they need.
permissions: {}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"

jobs:
  quality-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ">=2.6"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Key is namespaced `pr-` so it can never collide with a cache
          # produced by the release workflow on `main`. Defence in depth on
          # top of GitHub's per-ref cache scoping.
          path: .turbo
          key: turbo-pr-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            turbo-pr-${{ runner.os }}-

      - name: Build all packages
        run: |
          echo "::group::Building all packages"
          pnpm run build
          echo "::endgroup::"

      - name: Rebuild symlinks after build
        run: |
          echo "::group::Recreating CLI binary symlinks"
          pnpm install --frozen-lockfile
          echo "::endgroup::"

      - name: Generate CLI test projects
        run: |
          echo "::group::Generating ignored CLI test outputs"
          pnpm --filter @rexeus/typeweaver run test:gen
          echo "::endgroup::"

      - name: Run multi-runtime bundle tests
        run: |
          echo "::group::Running bundle tests on Node.js, Deno, and Bun"
          pnpm run --filter @rexeus/typeweaver test:bundle:all
          echo "::endgroup::"

      - name: Run typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          echo "::group::TypeScript type checking"
          pnpm run typecheck
          echo "::endgroup::"

      # Durable post-migration gate: package-manager portability, the pinned
      # Effect baseline, public contracts, generated output, workspace tests,
      # and packed-consumer compatibility.
      - name: Verify architecture contracts
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          echo "::group::Architecture contracts"
          pnpm run verify:architecture-contracts
          echo "::endgroup::"

      - name: Verify documentation
        run: |
          echo "::group::Documentation contracts and executable examples"
          pnpm run docs:check
          echo "::endgroup::"

      - name: Check formatting
        run: |
          echo "::group::oxfmt format checking"
          pnpm run format:check
          echo "::endgroup::"

      - name: Run lint
        run: |
          echo "::group::oxlint checking"
          pnpm run lint
          echo "::endgroup::"

      - name: Run dry run publish
        run: |
          echo "::group::Dry run publishing all packages"
          pnpm run publish:dry
          echo "::endgroup::"

  windows-security:
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Rebuild symlinks after build
        run: pnpm install --frozen-lockfile

      - name: Run Windows security contracts
        run: pnpm run test:windows-security
